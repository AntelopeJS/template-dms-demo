services:
  template-cms-demo-backend:
    command: pnpm dev
    port: 5010
    health: /cms/sitelayout

  template-cms-demo-frontend:
    command: >-
      until curl -fsS http://127.0.0.1:5010/cms/sitelayout >/dev/null; do sleep 0.5; done;
      PORT=3001
      NUXT_PUBLIC_CMS_BASE_URL="$CMS_GATEWAY_URL"__cms_api
      NUXT_PUBLIC_CMS_CLIENT_BASE_URL="$CMS_GATEWAY_URL"
      pnpm frontend:dev
    port: 3001
    env:
      CMS_GATEWAY_URL: ${services.template-cms-demo-gateway.publicURL}

  template-cms-demo-gateway:
    command: node .amp/gateway.mjs
    port: 3002
    health: /__gateway_health
    portal:
      title: Template CMS Demo
      description: CMS frontend
