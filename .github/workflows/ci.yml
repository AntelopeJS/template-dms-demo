name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: Run the nightly tier, with the Windows jobs and Stress
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v2
    with:
      # `pnpm run checks` typechecks but never emits; this proves `dist`
      # still builds, the output `ajs project run` and `ajs dms build` load.
      extra-commands: |
        pnpm build
        if [[ -d .github/scripts/template ]]; then pnpm exec tsc -p .github/scripts/template; fi
        if [[ -d .github/scripts/template && "$ANTELOPEJS_CI_TIER" != fast && "$RUNNER_OS" == Linux ]]; then node --test --test-isolation=none .github/scripts/template/*.test.mts; fi
      extra-commands-job: true
      extra-commands-shards: 4
      renovate-sync: false
      test-job: true
      affected-tests: true
      module-locks: true
      nightly: ${{ inputs.nightly == true }}
    permissions:
      contents: read
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
      statuses: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v2
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
  module-locks:
    needs: ci
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      actions: read
    uses: AntelopeJS/.github/.github/workflows/module-locks-renovate.yml@v2
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
  verdict:
    needs: [ci, renovate-sync, module-locks]
    if: ${{ !cancelled() }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "$failed"
            exit 1
          fi
