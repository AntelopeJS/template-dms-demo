name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v2
    with:
      # `pnpm run checks` typechecks but never emits; this proves `dist`
      # still builds, the output `ajs project run` and `ajs dms build` load.
      extra-commands: |
        pnpm build
        if [[ -d .github/scripts/template ]]; then pnpm exec tsc -p .github/scripts/template; fi
        if [[ -d .github/scripts/template && "$ANTELOPEJS_CI_TIER" != fast && "$RUNNER_OS" == Linux ]]; then node --test --test-isolation=none ${ANTELOPEJS_CI_SHARD:+--test-shard="$ANTELOPEJS_CI_SHARD"} .github/scripts/template/*.test.mts; fi
      extra-commands-job: true
      extra-commands-shards: 3
      renovate-sync: false
      test-job: true
      affected-tests: true
      module-locks: true
    permissions:
      contents: read
  locked-build:
    name: Locked build
    if: github.repository == 'AntelopeJS/template-dms-demo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Build a clean clone from the committed module locks
        run: |
          set -o pipefail
          node --test --test-isolation=none --test-reporter=spec --test-name-pattern=locked-build .github/scripts/template/deploy.test.mts | tee "$RUNNER_TEMP/locked-build.log"
          grep -q "✔ locked-build" "$RUNNER_TEMP/locked-build.log"
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
      statuses: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v2
  module-locks:
    needs: ci
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      actions: read
    uses: AntelopeJS/.github/.github/workflows/module-locks-renovate.yml@v2
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
