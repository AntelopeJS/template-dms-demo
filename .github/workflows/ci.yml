name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    env:
      COREPACK_DEFAULT_TO_LATEST: 0
    steps:
      - uses: actions/checkout@v4

      - name: Configure the AntelopeJS private npm registry
        run: |
          echo '@antelopejs-private:registry=https://npm.antelopejs.cloud/' >> ~/.npmrc
          echo '//npm.antelopejs.cloud/:_authToken=${{ secrets.NPM_ANTELOPE_TOKEN }}' >> ~/.npmrc

      - uses: actions/setup-node@v4
        with:
          # Node 22.18+ is what oxlint needs to read a TypeScript config; the
          # version itself lives in .nvmrc so there is one source of truth.
          node-version-file: .nvmrc
      - run: npm i -g --force corepack && corepack enable
      - run: pnpm install && cd nuxt-layer && pnpm install
      - run: pnpm lint
      # Unused dependencies only. `pnpm knip:all` also reports dead files and
      # exports, which need a human to confirm, so they stay out of the gate.
      - run: pnpm knip
      - run: pnpm build
