name: module locks

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/module-locks.yml
      - .github/scripts/refresh-module-locks.sh
      - antelope.config.ts
permissions:
  contents: read

concurrency:
  group: module-locks-${{ github.event_name == 'pull_request' && github.ref || 'default' }}
  cancel-in-progress: false

env:
  BRANCH: antelopejs/module-locks

jobs:
  refresh:
    name: Refresh the module locks
    if: github.repository == 'AntelopeJS/template-dms-demo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      state: ${{ steps.refresh.outputs.state }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Start from the module locks on the default branch
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          git rm -rq --ignore-unmatch antelope-lock
          git checkout "origin/${BASE}" -- antelope-lock
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit --no-verify -q -m "build: take the module locks of ${BASE}"

      - name: Record the latest release of each module
        id: refresh
        run: |
          mkdir -p "$RUNNER_TEMP/locks"
          state=$(.github/scripts/refresh-module-locks.sh "$RUNNER_TEMP/locks/body.md")
          echo "state=${state}" >> "$GITHUB_OUTPUT"
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/locks/refresh.patch"
          case "$state" in
            current) echo "No module version moved in \`antelope-lock/\`." ;;
            *) cat "$RUNNER_TEMP/locks/body.md" ;;
          esac >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.refresh.outputs.state != 'current'
        with:
          name: module-locks
          path: ${{ runner.temp }}/locks
          retention-days: 1

  publish:
    name: Open or update the pull request
    needs: refresh
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
      STATE: ${{ needs.refresh.outputs.state }}
      TITLE: "build(deps): update the AntelopeJS module locks"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.STATE == 'changed'
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.STATE != 'current'
        with:
          name: module-locks
          path: ${{ runner.temp }}/locks

      - name: Push the refreshed locks
        if: env.STATE == 'changed'
        run: |
          git apply --index "$RUNNER_TEMP/locks/refresh.patch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --no-verify -q -m "$TITLE"
          git push --no-verify -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"

      - name: Open, update or close the pull request
        run: |
          number=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --base "$BASE" --state open --json number,isCrossRepository --jq 'map(select(.isCrossRepository | not))[0].number // empty')
          if [ "$STATE" = current ]; then
            if [ -n "$number" ]; then
              gh pr close -R "$GITHUB_REPOSITORY" "$number" --delete-branch --comment "No module version on \`${BASE}\` moved since this pull request opened, or \`${BASE}\` already has these locks."
            fi
            exit 0
          fi
          echo -e "\nOpened by the [module locks workflow](${RUN_URL})." >> "$RUNNER_TEMP/locks/body.md"
          if [ -n "$number" ]; then
            gh pr edit -R "$GITHUB_REPOSITORY" "$number" --body-file "$RUNNER_TEMP/locks/body.md"
          else
            gh pr create -R "$GITHUB_REPOSITORY" --base "$BASE" --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/locks/body.md"
          fi
