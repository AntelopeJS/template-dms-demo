name: module locks

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/module-locks.yml

permissions:
  contents: read

jobs:
  refresh:
    if: github.repository == 'AntelopeJS/template-dms-demo'
    permissions:
      contents: read
    uses: AntelopeJS/.github/.github/workflows/module-locks-refresh.yml@v2
    with:
      projects: |
        .
      commands: |
        pnpm update --no-save '@antelopejs/interface-*' @antelopejs/dms @antelopejs/dms-frontend
        pnpm exec oxfmt package.json antelope.config.ts
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
