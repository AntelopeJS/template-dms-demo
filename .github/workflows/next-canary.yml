name: next canary

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/next-canary.yml
      - .github/scripts/**
permissions:
  contents: read

concurrency:
  group: next-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Demo on the next previews
    if: github.repository == 'AntelopeJS/template-dms-demo'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Point every @antelopejs package at its next preview
        run: node .github/scripts/use-next-previews.mts

      - name: Install the previews, and the newest stable release each other range allows
        run: |
          pnpm install --no-frozen-lockfile
          pnpm update --no-save '@antelopejs/*'
          pnpm exec oxfmt package.json antelope.config.ts

      - name: Build
        run: pnpm build

      - name: Run checks
        run: pnpm run checks

      - name: Boot the demo and run the smoke test
        run: |
          git config --global user.name "next canary"
          git config --global user.email "next-canary@users.noreply.github.com"
          run=$(pnpm exec antelopejs-verify new --base HEAD --title "next canary" | tail -n 1)
          echo "VERIFY_RUN=${run}" >> "$GITHUB_ENV"
          pnpm exec antelopejs-verify journey "$run" smoke

      - name: Show the output of each failed smoke step
        if: failure() && env.VERIFY_RUN != ''
        run: |
          for code in "$VERIFY_RUN"/evidence/*/*/*/exit-code.txt; do
            [ "$(cat "$code")" = 0 ] && continue
            step=$(dirname "$code")
            echo "::group::${step#"$VERIFY_RUN/evidence/"}"
            cat "$step/command.txt" "$step/stdout.txt" "$step/stderr.txt" 2>/dev/null | tail -n 200
            echo "::endgroup::"
          done

      - name: Stop what the smoke test started
        if: always() && env.VERIFY_RUN != ''
        run: pnpm exec antelopejs-verify clean "$VERIFY_RUN"
