name: next canary

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/next-canary.yml
      - .github/scripts/**
permissions:
  contents: read

concurrency:
  group: next-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Demo on the next previews
    if: github.repository == 'AntelopeJS/template-dms-demo'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Point every @antelopejs package at its next preview
        run: |
          node .github/scripts/use-next-previews.mts
          cat "$GITHUB_STEP_SUMMARY"

      - name: Install the previews, and the newest stable release each other range allows
        run: |
          pnpm install --no-frozen-lockfile
          pnpm update --no-save '@antelopejs/*'
          pnpm exec oxfmt package.json antelope.config.ts

      - name: Build
        run: pnpm build

      - name: Write the files the previews sync
        run: pnpm run sync

      - name: Run checks
        run: pnpm run checks

      - name: Boot the demo and run the smoke test
        run: node --test --test-isolation=none .github/scripts/template/smoke.test.mts

      - name: Upload the npm debug logs of the journeys
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-logs
          path: ~/.cache/template-dms-demo-tests/npm/_logs
          if-no-files-found: ignore
