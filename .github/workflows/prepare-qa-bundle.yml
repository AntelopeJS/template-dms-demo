name: Prepare QA bundle

on:
  workflow_dispatch:
  push:
    branches:
      - chore/update-cms-and-add-media

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      COREPACK_DEFAULT_TO_LATEST: 0
      NODE_AUTH_TOKEN: ${{ secrets.AJS_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure private dependencies
        run: |
          git config --global url."https://${{ secrets.AJS_GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          echo '@antelopejs-private:registry=https://npm.antelopejs.cloud/' >> ~/.npmrc
          echo '//npm.antelopejs.cloud/:_authToken=${{ secrets.NPM_ANTELOPE_TOKEN }}' >> ~/.npmrc

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec ajs project modules install
      - run: pnpm build

      - name: Pack prepared workspace
        run: tar --zstd -cf qa-bundle.tar.zst node_modules .antelope dist

      - uses: actions/upload-artifact@v4
        with:
          name: qa-bundle
          path: qa-bundle.tar.zst
          retention-days: 1
          compression-level: 0
